# Spielebibliothek – Docker-Compose-Stack
# Liegt auf der NAS unter /volume1/docker/spielebibliothek/compose.yaml
# Spezifikation: seb-brain → Projekte/Spielebibliothek/Architektur/Docker-Compose
#
# Stand: Phase 6 (caddy, savesvc, filebrowser, cloudflared; kein Port am Host).

name: spielebibliothek

services:
  caddy:
    image: caddy:2
    container_name: spielebibliothek-caddy
    restart: unless-stopped
    # Feste UID, bekommt auf /volume1/games/spiele nur r-X per ACL (siehe scripts/nas-setup.sh)
    user: "10020:10020"
    read_only: true
    cap_drop: [ALL]
    # Das caddy-Binary trägt die File-Capability cap_net_bind_service. Fehlt sie im
    # Bounding-Set, verweigert der Kernel den Start ("exec: operation not permitted").
    # Wegen no-new-privileges wird sie trotzdem nicht gewährt; Caddy nutzt ohnehin :8080.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    environment:
      # Caddy will Konfig/Daten schreiben – als Nicht-root nur nach /tmp
      XDG_CONFIG_HOME: /tmp/config
      XDG_DATA_HOME: /tmp/data
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - ./lib:/srv/lib:ro
      - /volume1/games/spiele:/srv/spiele:ro
    # Kein Port am Host: erreichbar nur über cloudflared (seit Phase 2, 05.11.2026).
    # Für Tests im LAN vorübergehend wieder einkommentieren:
    # ports:
    #   - "8088:8080"
    networks: [intern]

  savesvc:
    build: ./savesvc
    image: spielebibliothek-savesvc
    container_name: spielebibliothek-savesvc
    restart: unless-stopped
    # UID 10022 ist im Image gesetzt: rwX auf data/, r-X auf spiele/ (scripts/nas-setup.sh)
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      # nicht geheim: Team-Domain und AUD-Tag der Access-Anwendung "games"
      ACCESS_TEAM_DOMAIN: cold-glitter-fc3b.cloudflareaccess.com
      ACCESS_AUD: 16a18e7f5f0f0cf8060c0c274276a4f5f895aa0a38abdb90c6c75575d902a2b1
      # DEV_USER ist hier VERBOTEN (würde die Anmeldung überspringen)
    volumes:
      - /volume1/games/data:/data
      - /volume1/games/spiele:/spiele:ro
      # config/users.yaml: E-Mail → Benutzername; nur auf der NAS, nicht im Git (Vorlage: users.example.yaml).
      # Ordner statt Einzeldatei, damit Editoren, die die Datei ersetzen (sed -i, vim), sofort wirken.
      - ./config:/config:ro
    networks: [intern]

  filebrowser:
    # Upload unter upload.cuby0401.uk. Version fest, damit ein Update nicht unbemerkt Einstellungen ändert.
    image: filebrowser/filebrowser:v2.63.23
    container_name: spielebibliothek-filebrowser
    restart: unless-stopped
    # Feste UID 10021: rwX auf spiele/ und filebrowser/ (scripts/nas-setup.sh). Das Image wäre sonst 1000 = Sebi.
    user: "10021:10021"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      # Nicht-root darf nicht auf 80 lauschen; gilt auch für den Healthcheck des Images
      FB_PORT: "8080"
    volumes:
      - /volume1/games/spiele:/srv
      - /volume1/games/filebrowser/config:/config
      - /volume1/games/filebrowser/database:/database
    # Einstellungen und Benutzer NUR über scripts/filebrowser.sh (legt keinen Standard-Admin an)
    networks: [intern]

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: spielebibliothek-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN fehlt in .env}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Public Hostnames im Cloudflare-Dashboard:
    #   games.cuby0401.uk  → http://caddy:8080
    #   play.cuby0401.uk   → http://caddy:8080
    #   upload.cuby0401.uk → http://filebrowser:8080
    depends_on: [caddy]
    networks: [intern]

networks:
  intern:
    name: spielebibliothek
