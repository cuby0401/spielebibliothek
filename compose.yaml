# Spielebibliothek – Docker-Compose-Stack
# Liegt auf dem Server im Stack-Ordner (NAS: /volume1/docker/spielebibliothek, Docker-VM: /opt/stacks/spielebibliothek).
# Spezifikation: seb-brain → Projekte/Spielebibliothek/Architektur/Docker-Compose
#
# Wo Spiele und Datenbanken liegen, steht in der .env des Servers (Standard = NAS):
#   SPIELE_DIR        Spiele, Entwürfe, Versionen          NAS: /volume1/games/spiele   VM: per SMB von der NAS
#   DATEN_DIR         saves.db und backup/                 NAS: /volume1/games/data     VM: lokale Platte (nie auf einer Freigabe)
#   UPLOAD_DATEN_DIR  upload.db und Sitzungs-Schlüssel     NAS: /volume1/games/filebrowser/upload   VM: lokale Platte
#
# Stand: Phase 6b (caddy, savesvc, upload, cloudflared; kein Port am Host).

name: spielebibliothek

services:
  caddy:
    image: caddy:2
    container_name: spielebibliothek-caddy
    restart: unless-stopped
    # Feste UID, bekommt auf den Spielen nur r-X per ACL (NAS, scripts/nas-setup.sh) bzw. über die Gruppe 10021 (VM: Spiele
    # per SMB, dort gibt es keine ACLs – scripts/server-setup.sh). Der Ordner ist ohnehin nur lesend eingebunden.
    user: "10020:10020"
    group_add: ["10021"]
    read_only: true
    cap_drop: [ALL]
    # Das caddy-Binary trägt die File-Capability cap_net_bind_service. Fehlt sie im
    # Bounding-Set, verweigert der Kernel den Start ("exec: operation not permitted").
    # Wegen no-new-privileges wird sie trotzdem nicht gewährt; Caddy nutzt ohnehin :8080.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    environment:
      # Caddy will Konfig/Daten schreiben – als Nicht-root nur nach /tmp
      XDG_CONFIG_HOME: /tmp/config
      XDG_DATA_HOME: /tmp/data
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - ./lib:/srv/lib:ro
      - ${SPIELE_DIR:-/volume1/games/spiele}:/srv/spiele:ro
      # Nur für den Not-Aus (1.4.0, Nachtest 08.11.): Caddy prüft, ob config/notaus.json existiert – lesen darf es dort nichts (nur u:10020:x)
      - ./config:/config:ro
    # Kein Port am Host: erreichbar nur über cloudflared (seit Phase 2, 05.11.2026).
    # Für Tests im LAN vorübergehend wieder einkommentieren:
    # ports:
    #   - "8088:8080"
    networks: [intern]

  savesvc:
    build: ./savesvc
    image: spielebibliothek-savesvc
    container_name: spielebibliothek-savesvc
    restart: unless-stopped
    # UID 10022 ist im Image gesetzt: rwX auf data/, r-X auf spiele/ (scripts/nas-setup.sh bzw. Gruppe 10021 auf der VM)
    group_add: ["10021"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      # nicht geheim: Team-Domain und AUD-Tag der Access-Anwendung "games"
      ACCESS_TEAM_DOMAIN: cold-glitter-fc3b.cloudflareaccess.com
      ACCESS_AUD: 16a18e7f5f0f0cf8060c0c274276a4f5f895aa0a38abdb90c6c75575d902a2b1
      # Konsistente DB-Kopie (NAS: borgmatic sichert um 02:00 data/backup/; VM: scripts/sicherung-export.sh legt sie um 01:50 auf die NAS)
      BACKUP_ZIEL: /data/backup/saves-latest.db
      # Admin-Panel (games.cuby0401.uk/admin) und interne Schnittstelle zum Upload-Dienst
      ADMINS: seb
      # Wer bei der Übernahme ins CRM (erster Start von 1.4.x) die Rolle Tester bekommt. Danach zählt nur das CRM.
      TESTER: ${TESTER:-}
      INTERN_TOKEN: ${INTERN_TOKEN:?INTERN_TOKEN fehlt in .env – deploy.sh legt es an}
      UPLOAD_URL: http://upload:8000
      BACKUP_UHRZEIT: "01:45"
      # Speicher je Entwickler in MB (Anzeige im Admin-Panel; muss zum Upload-Dienst passen), in .env änderbar
      UPLOAD_KONTINGENT_MB: ${UPLOAD_KONTINGENT_MB:-1024}
      # Home Assistant: Wächter (alle 5 Min Lebenszeichen/Probleme) und neue Anträge, siehe docs/home-assistant.md. Leer = aus.
      HA_WEBHOOK_URL: ${HA_WEBHOOK_URL:-}
      # Cloudflare-Abgleich (nur lesen) im Admin-Panel, siehe docs/cloudflare-abgleich.md. Leer = aus.
      # Der Nur-Lese-Schlüssel liegt in /data/cloudflare-lesen.token (nur für diesen Dienst lesbar), nie hier oder in .env.
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      # Einladungsmails aus dem CRM (Zentrale 1.4.0) über ein vorhandenes Postfach, siehe docs/crm.md. Leer = aus.
      # Zugangsdaten nur in .env (Modus 600) – nie ins Git, nie in Logs.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_VERSCHLUESSELUNG: ${SMTP_VERSCHLUESSELUNG:-starttls}
      SMTP_BENUTZER: ${SMTP_BENUTZER:-}
      SMTP_PASSWORT: ${SMTP_PASSWORT:-}
      SMTP_ABSENDER: ${SMTP_ABSENDER:-}
      # DEV_USER ist hier VERBOTEN (würde die Anmeldung überspringen)
    volumes:
      - ${DATEN_DIR:-/volume1/games/data}:/data
      - ${SPIELE_DIR:-/volume1/games/spiele}:/spiele:ro
      # config/users.yaml: E-Mail → Benutzername; nur auf der NAS, nicht im Git (Vorlage: users.example.yaml).
      # Seit 1.4.0 ein Export aus dem CRM (Datenbank) – für den Upload-Dienst und als Notfall-Rückweg. Schreibbar.
      - ./config:/config
    networks: [intern]

  upload:
    # Upload-Dienst (Phase 6b, ersetzt File Browser – E19): gleicher Code wie savesvc, anderer Einstieg.
    image: spielebibliothek-savesvc
    pull_policy: never        # wird von savesvc gebaut
    depends_on: [savesvc]
    container_name: spielebibliothek-upload
    restart: unless-stopped
    command: ["uvicorn", "savesvc.upload:app_factory", "--factory", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--no-server-header"]
    # UID 10021 (früher File Browser): rwX auf spiele/ und filebrowser/ (scripts/nas-setup.sh)
    user: "10021:10021"
    read_only: true
    tmpfs:
      - /tmp:size=300m        # Uploads bis 100 MB werden hier zwischengespeichert
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      ACCESS_TEAM_DOMAIN: cold-glitter-fc3b.cloudflareaccess.com
      # AUD der Access-Anwendung "upload" (Richtlinie Entwickler, 15 min)
      ACCESS_AUD: 1437ffb5ec6d16a425902f5569fea23258ab8ff2cafdfc0d52c1b968b9657351
      UPLOAD_DATA: /data
      INTERN_TOKEN: ${INTERN_TOKEN:?INTERN_TOKEN fehlt in .env – deploy.sh legt es an}
      # Speicher je Entwickler in MB (Spiele + Entwürfe + aufgehobene Versionen), in .env änderbar
      UPLOAD_KONTINGENT_MB: ${UPLOAD_KONTINGENT_MB:-1024}
      # MCP-Server für die KIs der Entwickler (Zentrale 1.6.0): öffentliche Adressen (Standard = live)
      MCP_URL: https://mcp.cuby0401.uk
      UPLOAD_OEFFENTLICH: https://upload.cuby0401.uk
      GAMES_OEFFENTLICH: https://games.cuby0401.uk
    volumes:
      - ${SPIELE_DIR:-/volume1/games/spiele}:/spiele
      # Handbuch und Vorlagen für den MCP-Server (nur lesen)
      - ./site/handbuch:/handbuch:ro
      # Passwort-Hashes und Sitzungs-Schlüssel (Ordner liegt unter filebrowser/, dort hat UID 10021 schon Rechte)
      - ${UPLOAD_DATEN_DIR:-/volume1/games/filebrowser/upload}:/data
      - ./config:/config:ro
    networks: [intern]

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: spielebibliothek-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN fehlt in .env}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Public Hostnames im Cloudflare-Dashboard:
    #   games.cuby0401.uk  → http://caddy:8080
    #   play.cuby0401.uk   → http://caddy:8080
    #   upload.cuby0401.uk → http://caddy:8080
    #   mcp.cuby0401.uk    → http://caddy:8080   (1.6.0, OHNE Access-Anwendung – der MCP-Server meldet selbst an)
    depends_on: [caddy]
    networks: [intern]

networks:
  intern:
    name: spielebibliothek
