<html lang="de">
<head>

<title>Klick-Muster CRM 1.5.0 – Spielebibliothek</title>
<style>
:root { --grund:#f6f5f2; --flaeche:#fff; --text:#1d1d1f; --leise:#6b6b70; --linie:#e2e0db; --akzent:#2f6f4f; --akzent-text:#fff; --warn:#9a5b00; --rot:#b3261e; --gelb:#e9b949; color-scheme:light; }
@media (prefers-color-scheme: dark) { :root { --grund:#151517; --flaeche:#1f1f22; --text:#ececef; --leise:#9a9aa2; --linie:#333338; --akzent:#5fb98b; --akzent-text:#0d1a13; --warn:#e0a24a; --rot:#f2867d; color-scheme:dark; } }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
body { margin:0; background:var(--grund); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }

.kopf { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.75rem 1.25rem; border-bottom:1px solid var(--linie); background:var(--flaeche); }
.marke { font-weight:650; text-decoration:none; font-size:1.1rem; }
main { padding:1.25rem; max-width:1150px; margin:0 auto; }
.reiter { display:flex; gap:.3rem; flex-wrap:wrap; border-bottom:1px solid var(--linie); margin-bottom:1rem; }
.reiter a { padding:.5rem .9rem; text-decoration:none; border-radius:6px 6px 0 0; color:var(--leise); }
.reiter a.aktiv { color:var(--text); background:var(--flaeche); border:1px solid var(--linie); border-bottom-color:var(--flaeche); margin-bottom:-1px; font-weight:600; }
.reiter a.grau { opacity:.5; pointer-events:none; }
.knopf { display:inline-block; border:1px solid var(--akzent); border-radius:6px; padding:.35rem .8rem; background:var(--akzent); color:var(--akzent-text); font:inherit; text-decoration:none; cursor:pointer; }
.knopf.leise { background:transparent; color:var(--text); border-color:var(--linie); }
.knopf.gefahr { background:transparent; color:var(--rot); border-color:var(--rot); }
.knopf.klein { padding:.15rem .55rem; font-size:.85rem; }
.leise { color:var(--leise); }
.karte { background:var(--flaeche); border:1px solid var(--linie); border-radius:10px; padding:.9rem 1rem; }
h1 { font-size:1.5rem; margin:.2rem 0 .8rem; } h2 { font-size:1.05rem; margin:0 0 .6rem; } h3 { font-size:.95rem; margin:.8rem 0 .4rem; }
.suche { display:flex; gap:.5rem; margin-bottom:.8rem; }
.suche input { flex:1; font:inherit; font-size:1.1rem; padding:.6rem .8rem; border-radius:8px; border:1px solid var(--linie); background:var(--flaeche); color:var(--text); }
.chips { display:flex; flex-wrap:wrap; gap:.35rem; margin-bottom:1rem; align-items:center; }

.kacheln { display:grid; gap:.75rem; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); margin-bottom:1rem; }
.kennzahl { background:var(--flaeche); border:1px solid var(--linie); border-radius:10px; padding:.7rem .9rem; cursor:pointer; text-align:left; font:inherit; color:inherit; }
.kennzahl .wert { font-size:1.5rem; font-weight:700; } .kennzahl .text { color:var(--leise); font-size:.85rem; }
.tabelle-rahmen { overflow-x:auto; }
table { width:100%; border-collapse:collapse; background:var(--flaeche); border:1px solid var(--linie); border-radius:10px; overflow:hidden; }
th, td { text-align:left; padding:.45rem .7rem; border-bottom:1px solid var(--linie); vertical-align:top; }
th { font-size:.8rem; color:var(--leise); font-weight:600; }
tbody tr.klickbar { cursor:pointer; } tbody tr.klickbar:hover { background:var(--grund); }
.nr { font-family:ui-monospace,Menlo,monospace; font-size:.85rem; color:var(--leise); }
.handle { color:var(--leise); }
.avatar { display:inline-grid; place-items:center; width:2rem; height:2rem; border-radius:50%; background:var(--akzent); color:var(--akzent-text); font-weight:700; font-size:.8rem; flex:none; }
.avatar.gross { width:4.2rem; height:4.2rem; font-size:1.4rem; }
.wer { display:flex; gap:.55rem; align-items:center; }
.rolle, .status { display:inline-block; border-radius:999px; padding:0 .5rem; font-size:.75rem; font-weight:600; border:1px solid var(--linie); margin-right:.2rem; }
.status.aktiv { color:var(--akzent); border-color:var(--akzent); }
.status.eingeladen { color:var(--leise); }
.status.verwarnt { color:var(--warn); border-color:var(--warn); }
.status.gesperrt { color:var(--rot); border-color:var(--rot); }
.status.archiviert { color:var(--leise); border-style:dashed; }
.kopfkarte { display:flex; gap:1rem; align-items:center; flex-wrap:wrap; }
.kopfkarte .name { font-size:1.4rem; font-weight:700; line-height:1.2; }
.kopfkarte .zahlen { margin-left:auto; display:flex; gap:1.2rem; text-align:center; }
.kopfkarte .zahlen b { display:block; font-size:1.2rem; }
.aktionen { display:flex; flex-wrap:wrap; gap:.4rem; margin:.8rem 0 1rem; }
.hinweis { border-left:3px solid var(--gelb); background:var(--flaeche); padding:.5rem .8rem; border-radius:4px; margin-bottom:.8rem; }
.hinweis.rot { border-left-color:var(--rot); }
.raster { display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); align-items:start; }
.raster .breit { grid-column:1/-1; }
dl { display:grid; grid-template-columns:max-content 1fr; gap:.2rem .9rem; margin:0; }
dt { color:var(--leise); }
dd { margin:0; }
ul.einfach { list-style:none; padding:0; margin:0; }
ul.einfach li { padding:.35rem 0; border-bottom:1px solid var(--linie); }
ul.einfach li:last-child { border-bottom:0; }
.zeitleiste li { display:grid; grid-template-columns:7.5rem 1.6rem 1fr; gap:.3rem; }
.zeit { color:var(--leise); font-size:.85rem; }
.anm { position:relative; }
.anm::after { content:attr(data-anm); position:absolute; right:-.4rem; top:-.6rem; background:#6b4fbb; color:#fff; border-radius:999px; font-size:.7rem; font-weight:700; padding:0 .4rem; }
.notiz-muster { border:1px dashed #6b4fbb; border-radius:8px; padding:.6rem .8rem; margin:1rem 0; font-size:.9rem; }
.notiz-muster h2 { color:#6b4fbb; font-size:.95rem; }
dialog { border:1px solid var(--linie); border-radius:12px; background:var(--flaeche); color:var(--text); max-width:30rem; padding:1.1rem 1.2rem; }
dialog::backdrop { background:rgba(0,0,0,.35); }
dialog input { font:inherit; padding:.35rem .5rem; border-radius:6px; border:1px solid var(--linie); background:var(--grund); color:var(--text); width:100%; }
.toast { position:fixed; top:.8rem; left:50%; transform:translateX(-50%); background:var(--flaeche); border:1px solid var(--akzent); border-radius:8px; padding:.5rem 1rem; box-shadow:0 4px 14px rgba(0,0,0,.15); z-index:9; }
.zurueck { text-decoration:none; color:var(--leise); }
@media (max-width:640px) { .kopfkarte .zahlen { margin-left:0; } .zeitleiste li { grid-template-columns:1fr; } }
</style>
</head>
<body>

  { nr: 3, handle: "jonas", anzeige: "Jonas", vorname: "Jonas", nachname: "", rollen: ["tester", "spieler"], status: "verwarnt", dabei: "2026-11-05", zuletzt: "2026-11-20T08:02", mails: ["jonas@beispiel.de"], handleSeit: "2026-11-05", alteHandles: [],
    verwarnung: { grund: "Mehrfach dieselbe Anfrage gestellt", von: "seb", zeit: "2026-11-15T19:30" } },
  { nr: 4, handle: "mia", anzeige: "Mia", rollen: ["spieler"], status: "aktiv", dabei: "2026-11-06", zuletzt: "2026-10-01T10:00", mails: ["mia@beispiel.de"], handleSeit: "2026-11-06", alteHandles: [] },
  { nr: 5, handle: "kai", anzeige: null, rollen: ["spieler"], status: "eingeladen", dabei: "2026-11-12", zuletzt: null, mails: ["kai@beispiel.de"], handleSeit: "2026-11-12", alteHandles: [], einladung: "2026-11-12T18:00" },
  { nr: 6, handle: "tobi", anzeige: "Tobi", rollen: ["spieler"], status: "gesperrt", dabei: "2026-11-05", zuletzt: "2026-11-14T22:41", mails: ["tobi@beispiel.de"], handleSeit: "2026-11-05", alteHandles: [],
    sperre: { grund: "Fremde Spielstände per Skript abgefragt", bis: "2026-12-01", von: "seb", zeit: "2026-11-14T22:50" } },
  { nr: 7, handle: "alex_gamedev", anzeige: "Alex", rollen: ["entwickler", "spieler"], status: "aktiv", dabei: "2026-11-08", zuletzt: "2026-11-18T17:30", mails: ["alex@beispiel.de"], handleSeit: "2026-11-08", alteHandles: [] },
  { nr: 8, handle: null, anzeige: null, rollen: [], status: "geloescht", dabei: "2026-11-05", zuletzt: "2026-11-09T12:00", mails: [], alteHandles: [] },
];
const SPIELE = [

  { id: "lena/Pixel_Golf", titel: "Pixel Golf", von: 2, version: "0.9.0 (Entwurf)", spieler: 0, spielzeit: 0 },
  { id: "seb/Wortjagd", titel: "Wortjagd", von: 1, version: "1.0.0", spieler: 6, spielzeit: 19 * 3600 },

];
// gespielt: [person, spiel, sekunden, platz, erfolge, erfolgeGesamt]
const GESPIELT = [
  [2, "seb/Wortjagd", 5 * 3600, 2, 4, 6], [2, "alex_gamedev/Keks_Klicker", 3 * 3600, 5, 2, 10],
  [3, "lena/Sternenfaenger", 14 * 3600, 1, 9, 12], [3, "seb/Wortjagd", 2 * 3600, 4, 1, 6], [3, "alex_gamedev/Keks_Klicker", 7 * 3600, 2, 6, 10],
  [1, "lena/Sternenfaenger", 4 * 3600, 3, 5, 12], [4, "lena/Sternenfaenger", 1800, null, 0, 12], [6, "alex_gamedev/Keks_Klicker", 9 * 3600, 1, 10, 10],
  [7, "lena/Sternenfaenger", 6 * 3600, 2, 7, 12],
];
const ANFRAGEN = [
  { nr: 14, von: 3, an: 2, spiel: "lena/Sternenfaenger", art: "Fehler", status: "offen", text: "Nach Level 7 friert das Spiel ein", zeit: "2026-11-19T20:10" },
  { nr: 12, von: 3, an: 2, spiel: "lena/Sternenfaenger", art: "Fehler", status: "offen", text: "Nach Level 7 friert das Spiel ein (doppelt)", zeit: "2026-11-15T19:00" },
  { nr: 11, von: 7, an: 1, spiel: null, art: "Wunsch", status: "erledigt", text: "Dunkles Design für die Upload-Seite", zeit: "2026-11-12T09:00" },
  { nr: 9, von: 4, an: 7, spiel: "alex_gamedev/Keks_Klicker", art: "Wunsch", status: "abgelehnt", text: "Mehr Kekssorten", zeit: "2026-11-09T15:00" },
];
const ANMELDUNGEN = {
  1: [["Mac · Safari", "Deutschland", "2026-11-03", "2026-11-20T11:40", true], ["iPhone · Safari", "Deutschland", "2026-11-04", "2026-11-19T22:00"]],
  2: [["Windows · Chrome", "Deutschland", "2026-11-05", "2026-11-19T21:12"], ["Android · Chrome", "Deutschland", "2026-11-07", "2026-11-17T08:30"]],
  3: [["Windows · Firefox", "Deutschland", "2026-11-05", "2026-11-20T08:02"]],
  4: [["iPad · Safari", "Deutschland", "2026-11-06", "2026-10-01T10:00"]],
  6: [["Linux · Chrome", "Niederlande", "2026-11-05", "2026-11-14T22:41"]],
  7: [["Mac · Chrome", "Österreich", "2026-11-08", "2026-11-18T17:30"]],
};
// Sicherheitsprotokoll (1.5.0): abgelehnte Zugriffe, blockierte Uploads, Rate-Limits, getrennte Sitzungen, Admin-Aktionen
const SICHERHEIT = {
  6: [["2026-11-14T22:38", "Rate-Limit", "120 Abfragen fremder Spielstände in 1 Minute"], ["2026-11-14T22:39", "abgelehnt", "GET /api/saves/… einer anderen Person (403)"], ["2026-11-14T22:50", "Admin-Aktion", "gesperrt bis 01.12.2026 durch @seb"], ["2026-11-14T22:50", "Sitzung getrennt", "alle Geräte"]],
  2: [["2026-11-16T10:05", "Upload blockiert", "Pixel_Golf.zip enthielt eine .exe-Datei"]],
  3: [["2026-11-15T19:30", "Admin-Aktion", "verwarnt durch @seb"]],
};
const NOTIZEN = { 3: [["2026-11-15T19:31", "Hat sich entschuldigt, war ein Doppelklick-Problem. Ende November Verwarnung aufheben."]], 6: [["2026-11-14T22:55", "Hat behauptet, er wollte nur die Bestenliste testen. Am 01.12. Gespräch, dann entscheiden."]] };
const HANDLE_VERLAUF = { 2: [["2026-11-10T09:00", "@lena → @lena_dev", "selbst"]] };

// ---------- Hilfen ----------
const $ = (id) => document.getElementById(id);
const pnr = (n) => "P-" + String(n).padStart(4, "0");
const person = (nr) => P.find((p) => p.nr === nr);
const anzeigeVon = (p) => p.status === "geloescht" ? "gelöschte Person" : (p.anzeige || "@" + p.handle);
const initialen = (p) => p.status === "geloescht" ? "–" : (p.anzeige || p.handle).replace(/[^\p{L}\p{N} ]/gu, "").trim().split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase();
const datum = (s) => s ? new Date(s).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }) : "–";
const dz = (s) => s ? new Date(s).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "–";
const dauer = (s) => s >= 3600 ? Math.round(s / 3600) + " Std." : Math.round(s / 60) + " Min.";
const tageHer = (s) => s ? Math.floor((HEUTE - new Date(s)) / 864e5) : Infinity;
const ROLLEN = { admin: "Admin", entwickler: "Entwickler", tester: "Tester", spieler: "Spieler" };
const STATUS = { aktiv: "aktiv", eingeladen: "eingeladen", verwarnt: "verwarnt", gesperrt: "gesperrt", archiviert: "archiviert", geloescht: "gelöscht" };
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const link = (p) => p.status === "geloescht" ? `<span class="leise">gelöschte Person</span>` : `<a href="#p/${pnr(p.nr)}" title="${pnr(p.nr)} · @${esc(p.handle)}">${esc(anzeigeVon(p))}</a>`;
const spiel = (id) => SPIELE.find((s) => s.id === id);
const spielLink = (id) => `<a href="#spiel" onclick="toast('Führt im echten Panel zur Spielseite von „${esc(spiel(id).titel)}“.');return false">${esc(spiel(id).titel)}</a>`;
const anm = (n) => `<span class="anm" data-anm="${n}"></span>`;
function toast(t) { const e = $("toast"); e.textContent = t; e.hidden = false; clearTimeout(toast.z); toast.z = setTimeout(() => (e.hidden = true), 3500); }

// ---------- CRM-Start: Suche, Filter, Liste ----------
let filter = { rolle: null, status: null, inaktiv: false, q: "" };
function startSeite() {
  const sichtbar = P.filter((p) => p.status !== "geloescht" && p.status !== "archiviert");
  const zahl = (wert, text, f) => `<button class="kennzahl" onclick='setzeFilter(${JSON.stringify(f)})'><div class="wert">${wert}</div><div class="text">${text}</div></button>`;
  $("inhalt").innerHTML = `
    <h1>CRM ${anm(1)}</h1>
    <div class="suche">
      <input id="q" autofocus placeholder="Nummer (P-0003), Name, @handle oder E-Mail …" value="${esc(filter.q)}">
    </div>
    <div class="kacheln">
      ${zahl(sichtbar.length, "Personen", {})}
      ${zahl(sichtbar.filter((p) => tageHer(p.zuletzt) <= 30).length, "aktiv in 30 Tagen", {})}
      ${zahl(sichtbar.filter((p) => p.status === "eingeladen").length, "eingeladen, noch nie da", { status: "eingeladen" })}
      ${zahl(sichtbar.filter((p) => ["verwarnt", "gesperrt"].includes(p.status)).length, "verwarnt oder gesperrt", { status: "auffaellig" })}
      ${zahl(sichtbar.filter((p) => p.status !== "eingeladen" && tageHer(p.zuletzt) > 30).length, "seit 30 Tagen nicht da", { inaktiv: true })}
    </div>
    <div class="chips">${anm(2)}
      <span class="leise">Rolle:</span>${Object.entries(ROLLEN).map(([k, v]) => `<button class="chip ${filter.rolle === k ? "an" : ""}" onclick="setzeFilter({...filter, rolle: filter.rolle === '${k}' ? null : '${k}'})">${v}</button>`).join("")}
      <span class="leise" style="margin-left:.6rem">Status:</span>${["aktiv", "eingeladen", "verwarnt", "gesperrt", "archiviert"].map((k) => `<button class="chip ${filter.status === k ? "an" : ""}" onclick="setzeFilter({...filter, status: filter.status === '${k}' ? null : '${k}'})">${STATUS[k]}</button>`).join("")}
      <button class="chip ${filter.inaktiv ? "an" : ""}" style="margin-left:.6rem" onclick="setzeFilter({...filter, inaktiv: !filter.inaktiv})">seit 30 Tagen nicht da</button>
      ${filter.rolle || filter.status || filter.inaktiv ? `<button class="chip" onclick="setzeFilter({q: filter.q})">✕ Filter löschen</button>` : ""}
    </div>
    <div id="liste"></div>
    <div class="notiz-muster"><h2>Erklärungen zum Muster</h2>
      <ol>
        <li><b>CRM statt „Personen“:</b> eigener Reiter im Admin-Panel. Admins kommen auch aus der Bibliothek hin: Ein Klick auf einen Namen (Bestenliste, Spiel, Anfrage) öffnet für Admins die Personenkarte.</li>
        <li><b>Suche und Filter:</b> Die Suche findet Personennummer, Anzeigename, Vor-/Nachname, @handle (auch frühere) und Login-E-Mails. Bei genau einem Treffer öffnet Enter direkt die Karte. Die Kacheln oben sind zugleich Filter.</li>
        <li><b>Personennummer P-0007:</b> lesbare, fortlaufende Nummer für dich (zum Nennen und Suchen). Dahinter steckt die UUID, die nur intern verwendet wird.</li>
      </ol>
      <p class="leise">Zum Ausprobieren: „P-0006“, „lena“ (findet auch das alte Handle) oder „arbeit.example“ eintippen, oder die Kachel „seit 30 Tagen nicht da“ anklicken.</p>
    </div>`;
  const q = $("q");
  q.addEventListener("input", () => { filter.q = q.value; listeZeigen(); });
  q.addEventListener("keydown", (e) => { if (e.key === "Enter") { const t = treffer(); if (t.length === 1) location.hash = "#p/" + pnr(t[0].nr); } });
  q.focus(); q.setSelectionRange(q.value.length, q.value.length);
  listeZeigen();
}
function setzeFilter(f) {
  filter = { rolle: null, status: null, inaktiv: false, q: filter.q, ...f };
  startSeite();
}
function treffer() {
  const q = filter.q.trim().toLowerCase().replace(/^@/, "");
  return P.filter((p) => p.status !== "geloescht")
    .filter((p) => filter.status === "archiviert" ? p.status === "archiviert" : p.status !== "archiviert")
    .filter((p) => !filter.rolle || p.rollen.includes(filter.rolle))
    .filter((p) => !filter.status || filter.status === "archiviert" || (filter.status === "auffaellig" ? ["verwarnt", "gesperrt"].includes(p.status) : p.status === filter.status))
    .filter((p) => !filter.inaktiv || (p.status !== "eingeladen" && tageHer(p.zuletzt) > 30))
    .filter((p) => !q || [pnr(p.nr), String(p.nr), p.handle, ...(p.alteHandles || []), p.anzeige, p.vorname, p.nachname, ...p.mails].filter(Boolean).some((x) => x.toLowerCase().includes(q)));
}
function listeZeigen() {
  const t = treffer();
  $("liste").innerHTML = !t.length ? `<p class="leise">Niemand gefunden.</p>` : `
    <div class="tabelle-rahmen"><table><thead><tr><th>Nr. ${anm(3)}</th><th>Person</th><th>Rollen</th><th>Status</th><th>Zuletzt aktiv</th></tr></thead><tbody>
    ${t.map((p) => `<tr class="klickbar" onclick="location.hash='#p/${pnr(p.nr)}'">
      <td class="nr">${pnr(p.nr)}</td>
      <td><div class="wer"><span class="avatar">${initialen(p)}</span><div><b>${esc(anzeigeVon(p))}</b>${p.anzeige ? `<br><span class="handle">@${esc(p.handle)}</span>` : ""}${p.alteHandles.length ? ` <span class="leise">(früher @${p.alteHandles.join(", @")})</span>` : ""}</div></div></td>
      <td>${p.rollen.map((r) => `<span class="rolle">${ROLLEN[r]}</span>`).join("")}</td>
      <td><span class="status ${p.status}">${STATUS[p.status]}</span></td>
      <td>${p.zuletzt ? dz(p.zuletzt) + (tageHer(p.zuletzt) > 30 ? ` <span class="leise">(${tageHer(p.zuletzt)} Tage)</span>` : "") : `<span class="leise">noch nie angemeldet</span>`}</td></tr>`).join("")}
    </tbody></table></div>`;
}

// ---------- Personenkarte ----------
function karte(nr) {
  const p = person(nr);
  if (!p) { $("inhalt").innerHTML = `<p>Keine Person ${pnr(nr)}.</p>`; return; }
  const eigeneSpiele = SPIELE.filter((s) => s.von === nr);
  const gespielt = GESPIELT.filter((g) => g[0] === nr);
  const gestellt = ANFRAGEN.filter((a) => a.von === nr);
  const bekommen = ANFRAGEN.filter((a) => a.an === nr && a.von !== nr);
  const anmeldungen = ANMELDUNGEN[nr] || [];
  const sicherheit = SICHERHEIT[nr] || [];
  const notizen = NOTIZEN[nr] || [];
  const spielzeit = gespielt.reduce((s, g) => s + g[2], 0);
  const frist = p.handleSeit ? 30 - tageHer(p.handleSeit) : 0;

  // Zeitleiste – im echten System aus den vorhandenen Tabellen zusammengesetzt
  const ereignisse = [
    [p.dabei + "T09:00", "➕", p.einladung ? "eingeladen von @seb" : "angelegt"],
    ...(p.einladung ? [[p.einladung, "✉️", "Einladung verschickt"]] : []),
    ...anmeldungen.map((a) => [a[2] + "T10:00", "🔑", "erste Anmeldung auf " + a[0]]),
    ...eigeneSpiele.map((s) => [p.dabei + "T20:00", "⬆️", `hat ${spielLink(s.id)} hochgeladen (${s.version})`]),
    ...gestellt.map((a) => [a.zeit, "💬", `Anfrage <a href="#anfrage" onclick="toast('Öffnet Anfrage #${a.nr} (ab 1.6.0: Ticket).');return false">#${a.nr}</a> gestellt: ${esc(a.text)}`]),
    ...(HANDLE_VERLAUF[nr] || []).map((h) => [h[0], "🏷️", "Handle geändert: " + h[1]]),
    ...sicherheit.map((s) => [s[0], "🛡️", `${s[1]}: ${esc(s[2])}`]),
    ...(p.verwarnung ? [[p.verwarnung.zeit, "⚠️", "verwarnt: " + esc(p.verwarnung.grund)]] : []),
  ].sort((a, b) => b[0].localeCompare(a[0]));

  const block = (titel, inhalt, klasse = "") => `<section class="karte ${klasse}"><h2>${titel}</h2>${inhalt}</section>`;
  const bloecke = [];
  if (p.status !== "geloescht") bloecke.push(block("Stammdaten", `<dl>
      <dt>Nummer</dt><dd class="nr">${pnr(p.nr)}</dd>
      <dt>Handle</dt><dd>@${esc(p.handle)} <span class="leise">· geändert ${datum(p.handleSeit)}${frist > 0 ? `, wieder änderbar in ${frist} Tagen` : ""}</span>${p.alteHandles.length ? `<br><span class="leise">früher: @${p.alteHandles.join(", @")} (reserviert)</span>` : ""}</dd>
      <dt>Anzeigename</dt><dd>${esc(p.anzeige) || '<span class="leise">nicht gesetzt</span>'}</dd>
      ${p.vorname || p.nachname ? `<dt>Name</dt><dd>${esc([p.vorname, p.nachname].filter(Boolean).join(" "))}</dd>` : ""}
      ${p.geburtstag ? `<dt>Geburtstag</dt><dd>${datum(p.geburtstag)}</dd>` : ""}
      <dt>Login-E-Mails</dt><dd>${p.mails.map(esc).join("<br>")}</dd>
      <dt>Dabei seit</dt><dd>${datum(p.dabei)}</dd>
    </dl>`));
  if (notizen.length) bloecke.push(block("Notizen (nur für Admins)", `<ul class="einfach">${notizen.map((n) => `<li><span class="zeit">${dz(n[0])}</span><br>${esc(n[1])}</li>`).join("")}</ul>`));
  if (eigeneSpiele.length) bloecke.push(block(`Eigene Spiele (${eigeneSpiele.length})`, `<ul class="einfach">${eigeneSpiele.map((s) => `<li>${spielLink(s.id)} <span class="leise">· ${s.version} · ${s.spieler} Spieler · ${dauer(s.spielzeit)} gespielt</span></li>`).join("")}</ul>`));
  if (gespielt.length) bloecke.push(block(`Gespielt (${gespielt.length})`, `<div class="tabelle-rahmen"><table><thead><tr><th>Spiel</th><th>von</th><th>Spielzeit</th><th>Platz</th><th>Erfolge</th></tr></thead><tbody>
      ${gespielt.map((g) => `<tr><td>${spielLink(g[1])}</td><td>${link(person(spiel(g[1]).von))}</td><td>${dauer(g[2])}</td><td>${g[3] ? g[3] + "." : "–"}</td><td>${g[4]}/${g[5]}</td></tr>`).join("")}</tbody></table></div>`));
  if (gestellt.length || bekommen.length) bloecke.push(block(`Anfragen ${anm(5)}`, `
      ${gestellt.length ? `<h3>Gestellt (${gestellt.length})</h3><ul class="einfach">${gestellt.map((a) => `<li>#${a.nr} <span class="status">${a.status}</span> ${a.art}${a.spiel ? " zu " + spielLink(a.spiel) : ""} → ${link(person(a.an))}<br><span class="leise">${dz(a.zeit)} · ${esc(a.text)}</span></li>`).join("")}</ul>` : ""}
      ${bekommen.length ? `<h3>Als Entwickler bekommen (${bekommen.length}, ${bekommen.filter((a) => a.status === "offen").length} offen)</h3><ul class="einfach">${bekommen.map((a) => `<li>#${a.nr} <span class="status">${a.status}</span> ${a.art} zu ${spielLink(a.spiel)} von ${link(person(a.von))}<br><span class="leise">${dz(a.zeit)} · ${esc(a.text)}</span></li>`).join("")}</ul>` : ""}`));
  if (anmeldungen.length) bloecke.push(block(`Anmeldungen (${anmeldungen.length})`, `<ul class="einfach">${anmeldungen.map((a) => `<li>${a[0]}${a[4] ? ' <span class="status aktiv">dieses Gerät</span>' : ""} <span class="leise">· ${a[1]} · seit ${datum(a[2])} · zuletzt ${dz(a[3])}</span> <button class="knopf klein leise" onclick="toast('Gerät getrennt (Muster).')">Trennen</button></li>`).join("")}</ul>`));
  if (sicherheit.length) bloecke.push(block(`Sicherheitsprotokoll ${anm(6)}`, `<ul class="einfach">${sicherheit.map((s) => `<li><span class="zeit">${dz(s[0])}</span> <b>${s[1]}</b><br>${esc(s[2])}</li>`).join("")}</ul>`));
  bloecke.push(block(`Zeitleiste ${anm(7)}`, `<ul class="einfach zeitleiste">${ereignisse.map((e) => `<li><span class="zeit">${dz(e[0])}</span><span>${e[1]}</span><span>${e[2]}</span></li>`).join("")}</ul>`, "breit"));

  const aktionen = p.status === "geloescht" ? [] : [
    ["Handle ändern", "handleDialog(" + nr + ")", "leise"],
    ["Ansicht als …", "toast('Öffnet die Bibliothek so, wie @" + p.handle + " sie sieht.')", "leise"],
    ...(p.status === "eingeladen" ? [["Einladung erneut senden", "toast('Einladung verschickt (Muster).')", "leise"]] : []),
    ...(p.status === "verwarnt" ? [["Verwarnung aufheben", "toast('Verwarnung aufgehoben (Muster).')", "leise"]] : [["Verwarnen", "toast('Öffnet: Grund eingeben, Person bekommt ihn rot in die Glocke.')", "leise"]]),
    ...(p.status === "gesperrt" ? [["Entsperren", "toast('Entsperrt (Muster).')", "leise"]] : [["Sperren", "toast('Öffnet: Grund und optional Ablaufdatum.')", "gefahr"]]),
    ["Notiz", "toast('Notizfeld öffnet sich (nur für Admins sichtbar).')", "leise"],
    ["Export (Auskunft)", "toast('Lädt alle Daten der Person als JSON herunter.')", "leise"],
    ["Archivieren …", "toast('Archivieren mit Rückfrage. Endgültig löschen geht danach aus dem Archiv.')", "gefahr"],
  ];

  $("inhalt").innerHTML = `
    <p><a class="zurueck" href="#crm">← CRM</a> <span class="leise">· Suche bleibt erhalten</span></p>
    <section class="karte kopfkarte">
      <span class="avatar gross">${initialen(p)}</span>
      <div>
        <div class="name">${esc(anzeigeVon(p))} ${anm(4)}</div>
        <div class="leise">${p.handle && p.anzeige ? "@" + esc(p.handle) + " · " : ""}<span class="nr">${pnr(p.nr)}</span> · dabei seit ${datum(p.dabei)} · ${p.zuletzt ? "zuletzt aktiv " + dz(p.zuletzt) : "noch nie angemeldet"}</div>
        <div style="margin-top:.3rem">${p.rollen.map((r) => `<span class="rolle">${ROLLEN[r]}</span>`).join("")}<span class="status ${p.status}">${STATUS[p.status]}</span></div>
      </div>
      ${zahlenKopf(p, spielzeit, gespielt.length, eigeneSpiele.length, gestellt.length + bekommen.length)}
    </section>
    ${p.sperre ? `<div class="hinweis rot" style="margin-top:.8rem"><b>Gesperrt bis ${datum(p.sperre.bis)}</b> – ${esc(p.sperre.grund)} <span class="leise">(${dz(p.sperre.zeit)}, @seb)</span></div>` : ""}
    ${p.verwarnung ? `<div class="hinweis" style="margin-top:.8rem"><b>Verwarnt</b> – ${esc(p.verwarnung.grund)} <span class="leise">(${dz(p.verwarnung.zeit)}, @seb)</span></div>` : ""}
    ${p.status === "eingeladen" ? `<div class="hinweis" style="margin-top:.8rem">Eingeladen am ${dz(p.einladung)}, hat sich noch nie angemeldet. Häufigster Grund: Der E-Mail-Code kommt nicht an.</div>` : ""}
    ${p.status === "geloescht" ? `<div class="hinweis" style="margin-top:.8rem">Endgültig gelöscht (anonymisiert). In Bestenlisten und an Spielständen steht überall „gelöschte Person“. Übrig sind nur Nummer, Status und die Zeitleiste ohne Inhalte.</div>` : ""}
    <div class="aktionen">${aktionen.map((a) => `<button class="knopf ${a[2]} klein" onclick="${a[1]}">${a[0]}</button>`).join("")}</div>
    <div class="raster">${bloecke.join("")}</div>
    <div class="notiz-muster"><h2>Erklärungen zur Personenkarte</h2>
      <ol start="4">
        <li><b>Kopf:</b> Anzeigename groß, darunter @handle, Nummer, dabei seit, zuletzt aktiv. Rollen und Status als Plaketten. Warnungen (gesperrt, verwarnt, nie angemeldet) stehen gleich darunter.</li>
        <li><b>Anfragen in beide Richtungen:</b> was die Person gestellt hat und was sie als Entwickler bekommen hat. Ab 1.6.0 stehen hier die Tickets.</li>
        <li><b>Sicherheitsprotokoll:</b> neu in 1.5.0. Abgelehnte Zugriffe, Rate-Limits, blockierte Uploads, Admin-Aktionen, getrennte Sitzungen – je Person. Beispiel: <a href="#p/P-0006">P-0006 Tobi</a>.</li>
        <li><b>Zeitleiste:</b> alles zur Person, neueste zuerst. Wird beim Anzeigen aus den vorhandenen Daten zusammengesetzt, nicht doppelt gespeichert.</li>
      </ol>
      <p class="leise"><b>Leere Blöcke fehlen ganz</b> (dein Wunsch vom 07.11.): Vergleiche <a href="#p/P-0002">P-0002 Lena</a> (viel los) mit <a href="#p/P-0005">P-0005 kai</a> (eingeladen, nie da) und <a href="#p/P-0008">P-0008</a> (gelöscht). Personen und Spiele sind überall verlinkt.</p>
    </div>`;
}

// Kopf-Zahlen: nur, was nicht 0 ist – leere Teile fehlen ganz (Seb, 07.11.)
function zahlenKopf(p, spielzeit, gespielt, eigene, anfragen) {
  if (p.status === "geloescht") return "";
  const z = [[spielzeit ? dauer(spielzeit) : 0, "Spielzeit"], [gespielt, "gespielt"], [eigene, "eigene Spiele"], [anfragen, "Anfragen"]].filter((x) => x[0]);
  return z.length ? `<div class="zahlen">${z.map((x) => `<div><b>${x[0]}</b><span class="leise">${x[1]}</span></div>`).join("")}</div>` : "";
}

// ---------- Dialog: Handle ändern ----------
function handleDialog(nr) {
  const p = person(nr);
  const frist = 30 - tageHer(p.handleSeit);
  const d = $("dialog");
  d.innerHTML = `<h2>Handle von ${esc(anzeigeVon(p))} ändern</h2>
    <p class="leise">Aktuell <b>@${esc(p.handle)}</b>, geändert am ${datum(p.handleSeit)}. ${frist > 0 ? `Die Person selbst kann es erst in ${frist} Tagen wieder ändern – du als Admin jederzeit.` : "Die Person kann es selbst ändern (alle 30 Tage)."}</p>
    <label>Neues Handle<br><input id="neu" value="${esc(p.handle)}" maxlength="20"></label>
    <p id="pruefung" class="leise" style="min-height:2.6rem"></p>
    <p class="leise" style="font-size:.85rem">3–20 Zeichen: a–z, 0–9, _ und -. Frühere Handles bleiben für die Person reserviert, alte Profil-Adressen leiten weiter. Spiel-IDs und Spieleordner ändern sich nicht. Steht im Prüfprotokoll.</p>
    <div style="display:flex;gap:.5rem;justify-content:flex-end"><button class="knopf leise" onclick="dialog.close()">Abbrechen</button><button id="ok" class="knopf">Ändern</button></div>`;
  const vergeben = new Set(P.flatMap((x) => x.nr === nr ? [] : [x.handle, ...x.alteHandles]).filter(Boolean));
  const pruefen = () => {
    const v = $("neu").value.trim().toLowerCase();
    const fehler = !/^[a-z0-9_-]{3,20}$/.test(v) ? "Nur a–z, 0–9, _ und -, 3–20 Zeichen."
      : v === p.handle ? "Das ist das aktuelle Handle."
      : vergeben.has(v) ? `@${v} ist vergeben oder für jemand anderen reserviert.` : "";
    $("pruefung").innerHTML = fehler ? `<span style="color:var(--rot)">✗ ${fehler}</span>` : `<span style="color:var(--akzent)">✓ @${v} ist frei.</span>`;
    $("ok").disabled = !!fehler;
    return fehler ? null : v;
  };
  $("neu").addEventListener("input", pruefen);
  $("ok").onclick = () => { const v = pruefen(); if (!v) return; p.alteHandles.push(p.handle); (HANDLE_VERLAUF[nr] ||= []).push([HEUTE.toISOString(), `@${p.handle} → @${v}`, "durch @seb"]); p.handle = v; p.handleSeit = HEUTE.toISOString().slice(0, 10); d.close(); karte(nr); toast(`Handle geändert: jetzt @${v}.`); };
  pruefen();
  d.showModal();
}

// ---------- Routing ----------
function zeigen() {
  const m = location.hash.match(/^#p\/P-(\d{4})$/);
  if (m) karte(Number(m[1])); else startSeite();
  scrollTo(0, 0);
}
window.addEventListener("hashchange", zeigen);
zeigen();
</script>
</body>
</html>
