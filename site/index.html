<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spielebibliothek</title>
  <link rel="stylesheet" href="/style.css?v=__VERSION__">
</head>
<body>
  <header class="kopf">
    <a class="marke" href="#/">Spielebibliothek</a>
    <nav>
      <a class="knopf leise" id="upload-link" href="https://upload.cuby0401.uk" target="_blank" rel="noopener" hidden>Spiel hochladen</a>
      <a class="knopf leise" href="/hilfe/">Hilfe</a>
      <div class="menue">
        <button id="menue-knopf" class="knopf leise benutzer-knopf" type="button" aria-haspopup="true" aria-expanded="false" hidden>
          <span id="benutzer"></span> ▾
        </button>
        <div id="menue" class="menue-liste" hidden>
          <a href="#/einstellungen">Einstellungen</a>
          <a href="#/spielstaende">Meine Spielstände</a>
          <a href="#/meine-spiele" data-rolle="entwickler" hidden>Meine Spiele</a>
          <a href="#/antraege" data-rolle="entwickler" hidden>Anträge</a>
          <a href="/admin/" data-rolle="admin" hidden>Admin-Panel</a>
          <hr>
          <a href="/cdn-cgi/access/logout">Abmelden</a>
        </div>
      </div>
    </nav>
  </header>

  <p id="abgelaufen" class="abgelaufen" hidden>
    Deine Anmeldung ist abgelaufen – Spielstände werden gerade nicht gespeichert.
    <a href="">Seite neu laden</a>
  </p>

  <main>
    <p id="meldung" class="meldung" hidden></p>

    <section id="uebersicht">
      <div class="werkzeug">
        <label class="leise">Sortieren
          <select id="sortierung">
            <option value="alphabetisch">alphabetisch</option>
            <option value="zuletzt">zuletzt gespielt</option>
            <option value="neu">neueste zuerst</option>
          </select>
        </label>
      </div>
      <div id="kacheln" class="kacheln"></div>
    </section>

    <section id="seite" class="seite" hidden></section>

    <section id="spielansicht" hidden>
      <div class="spielleiste">
        <a class="knopf leise" href="#/">← Übersicht</a>
        <h1 id="spieltitel"></h1>
        <button id="vollbild" class="knopf" type="button">Vollbild</button>
      </div>
      <div class="spielbereich">
        <div id="rahmen" class="rahmen"></div>
        <aside class="bestenliste">
          <h2 id="bl-titel">Bestenliste</h2>
          <label class="bl-season" id="bl-season-wahl" hidden>Season
            <select id="bl-season"></select>
          </label>
          <ol id="bl-liste" class="bl-liste"></ol>
          <p id="bl-hinweis" class="leise"></p>
        </aside>
      </div>
    </section>
  </main>

  <script src="/lib/bridge.js?v=__VERSION__"></script>
  <script src="/app.js?v=__VERSION__"></script>
  <script src="/konto.js?v=__VERSION__"></script>
</body>
</html>
