<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keks-Klicker</title>
  <!-- Die EINZIGE Änderung gegenüber einem normalen KI-Spiel: diese Zeile als erstes Script -->
  <script src="/lib/gamesave.js"></script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
           font: 16px/1.5 system-ui, sans-serif; background: #fff6e8; color: #3b2a1a; }
    #keks { font-size: 6rem; background: none; border: 0; cursor: pointer; transition: transform .05s; }
    #keks:active { transform: scale(.92); }
    .zahl { font-size: 2rem; font-weight: 700; }
    button.kauf { font: inherit; padding: .4em .9em; border-radius: 6px; border: 1px solid #b07a3c; background: #fff; }
    small { color: #8a6a4a; }
  </style>
</head>
<body>
  <main>
    <h1>Keks-Klicker</h1>
    <div class="zahl"><span id="kekse">0</span> Kekse</div>
    <button id="keks" type="button" aria-label="Keks">🍪</button>
    <p><button class="kauf" id="oma" type="button">Oma kaufen (<span id="preis">10</span>)</button> Omas: <span id="omas">0</span></p>
    <p>Rekord: <span id="rekord">0</span> · <small>gespielt: <span id="starts">0</span>×</small></p>
  </main>

  <script>
    // Typischer KI-Code: speichert direkt in localStorage – gemischt mit getItem/setItem
    // und Eigenschafts-Schreibweise, Zustand als JSON.
    let state = JSON.parse(localStorage.getItem("keksState")) || { kekse: 0, omas: 0 };
    localStorage.starts = (parseInt(localStorage.starts) || 0) + 1;

    function preis() { return Math.floor(10 * Math.pow(1.15, state.omas)); }
    function zeigen() {
      document.getElementById("kekse").textContent = Math.floor(state.kekse);
      document.getElementById("omas").textContent = state.omas;
      document.getElementById("preis").textContent = preis();
      document.getElementById("rekord").textContent = localStorage.getItem("rekord") || 0;
      document.getElementById("starts").textContent = localStorage.starts;
    }
    function speichern() {
      localStorage.setItem("keksState", JSON.stringify(state));
      if (state.kekse > (parseInt(localStorage.getItem("rekord")) || 0)) {
        localStorage.setItem("rekord", Math.floor(state.kekse));
      }
    }

    document.getElementById("keks").onclick = () => { state.kekse++; zeigen(); speichern(); };
    document.getElementById("oma").onclick = () => {
      if (state.kekse >= preis()) { state.kekse -= preis(); state.omas++; zeigen(); speichern(); }
    };
    setInterval(() => { state.kekse += state.omas * 0.1; zeigen(); }, 100);
    setInterval(speichern, 5000);
    zeigen();
  </script>
</body>
</html>
